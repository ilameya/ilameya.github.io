<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description | strip_html | truncate: 160 }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="home" href="{{ '/' | relative_url }}"><i class="fa-solid fa-arrow-left"></i> Lameya Islam</a>
    <a class="all" href="{{ '/blog/' | relative_url }}">Blog</a>
  </header>

  <main class="listing">
    {{ content }}
  </main>

  <footer class="site-footer">
    © {{ 'now' | date: "%Y" }} Lameya Islam ·
    <a href="https://github.com/ilameya">GitHub</a> ·
    <a href="https://linkedin.com/in/ilameya">LinkedIn</a>
  </footer>
  <script src="{{ '/assets/js/blog.js' | relative_url }}"></script>
</body>
</html>
