" y="276.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">attention on 32 dims</text><path d="M 430 265 C 465 265, 470 160, 506 160" fill="none" stroke="#8a8984" stroke-width="1.4" marker-end="url(#arrow8a8984)"/><rect x="510" y="115" width="150" height="90" rx="10" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.5"/><text x="585.0" y="151.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">concatenate</text><text x="585.0" y="171.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">(T, 4 × 32 = 128)</text><line x1="660" y1="160" x2="698" y2="160" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="700" y="115" width="140" height="90" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="770.0" y="151.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Linear proj</text><text x="770.0" y="171.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">128 → 128</text><line x1="840" y1="160" x2="868" y2="160" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="870" y="120" width="110" height="80" rx="10" fill="#fdebe3" stroke="#eb6834" stroke-width="1.5"/><text x="925.0" y="151.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">output</text><text x="925.0" y="171.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-