t><text x="517.5" y="368.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">faster, same maths</text><rect x="690" y="332" width="305" height="50" rx="10" fill="#ffffff" stroke="#8a8984" stroke-width="1.5"/><text x="842.5" y="348.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Mixture of Experts</text><text x="842.5" y="368.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">route tokens to experts</text></svg>