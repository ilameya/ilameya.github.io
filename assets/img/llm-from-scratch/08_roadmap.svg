2514e" text-anchor="middle" dominant-baseline="middle">answers people prefer</text><line x1="807" y1="105" x2="838" y2="105" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="840" y="40" width="172" height="130" rx="10" fill="#fdebe3" stroke="#eb6834" stroke-width="1.5"/><text x="926.0" y="66" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Assistant</text><text x="926.0" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">answers questions,</text><text x="926.0" y="117" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">follows instructions</text><text x="106.0" y="188" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle" dominant-baseline="middle">you are here</text><text x="311.0" y="188" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">same architecture, same loss</text><rect x="20" y="220" width="1000" height="180" rx="10" fill="#fbfbfa" stroke="#8a8984" stroke-width="1.5" stroke-dasharray="5 4"/><text x="40" y="246" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">What modern LLMs change inside the architecture</text><rect x="40" y="270" width="305" height="50" rx="10" fill="#ffffff" stroke="#8a8984" stroke-width="1.5"/><text x="192.5" y="286.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">RoPE</text><text x="192.5" y="306.0" fon