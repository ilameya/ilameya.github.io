<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="From our tiny GPT to a modern chat assistant"><title>From our tiny GPT to a modern chat assistant</title><defs><marker id="arrow52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="40" width="172" height="130" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="106.0" y="66" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Our tiny GPT</text><text x="106.0" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">0.8M parameters</text><text x="106.0" y="117" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">1 MB of Shakespeare</text><text x="106.0" y="136" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">characters as tokens</text><line x1="192" y1="105" x2="223" y2="105" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="225" y="40" width="172" height="130" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="311.0" y="66" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Pretraining at scale</text><text x="311.0" y="98" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">billions of parameters</text>