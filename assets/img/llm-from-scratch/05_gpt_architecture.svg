<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 800" width="860" height="800" role="img" aria-label="The full GPT: embeddings, N transformer blocks, a final LayerNorm and a linear layer that scores every token in the vocabulary"><title>The full GPT: embeddings, N transformer blocks, a final LayerNorm and a linear layer that scores every token in the vocabulary</title><defs><marker id="arrow52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arrow6250d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="210" y="20" width="240" height="52" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="330.0" y="37.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">token ids</text><text x="330.0" y="57.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">e.g. [32, 53, 1, 40, 43]</text><path d="M 290 72 L 240 102" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow52514e)"/><path d="M 370 72 L 420 102" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow52514e)"/><rect x="125" y="104" width="190" height="56" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="220.0" y="123.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">token embedding</text><text x="220.0" y="143.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">table: V × C</text><rect x="345" y="104" width="190" height="56" rx="10" fill="#ecebfb" stroke="#6250d6" stroke-width="1.5"/><text x="440.0" y="123.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">position embedding</text><text x="440.0" y="143.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">table: block_size × C</text><path d="M 220 160 L 318 190" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow52514e)"/><path d="M 440 160 L 342 190" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow52514e)"/><circle cx="330" cy="200" r="13" fill="#fff" stroke="#52514e" stroke-width="1.8"/><line x1="322.85" y1="200" x2="337.15" y2="200" stroke="#52514e" stroke-width="2"/><line x1="330" y1="192.85" x2="330" y2="207.15" stroke="#52514e" stroke-width="2"/><line x1="330" y1="213" x2="330" y2="236" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="260" y="238" width="140" height="34" rx="10" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.5"/><text x="330.0" y="255.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">dropout</text><line x1="330" y1="272" x2="330" y2="296" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="160" y="298" width="340" height="188" rx="10" fill="#fbfbfa" stroke="#8a8984" stroke-width="1.5" stroke-dasharray="5 4"/><text x="490" y="316" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="end" dominant-baseline="middle">× N</text><text x="175" y="316" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start" dominant-baseline="middle">transformer block (Part 4)</text><rect x="190" y="332" width="280" height="34" rx="10" fill="#fdebe3" stroke="#eb6834" stroke-width="1.5"/><text x="330.0" y="349.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">LayerNorm → masked multi-head attention</text><text x="330" y="382" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">+ residual</text><rect x="190" y="398" width="280" height="34" rx="10" fill="#e0f5ed" stroke="#1baf7a" stroke-width="1.5"/><text x="330.0" y="415.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">LayerNorm → MLP</text><text x="330" y="448" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">+ residual</text><line x1="330" y1="486" x2="330" y2="512" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="230" y="514" width="200" height="40" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/><text x="330.0" y="534.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">final LayerNorm</text><line x1="330" y1="554" x2="330" y2="580" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="230" y="582" width="200" height="52" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="330.0" y="599.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">lm_head (Linear)</text><text x="330.0" y="619.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">C → V</text><line x1="330" y1="634" x2="330" y2="660" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="230" y="662" width="200" height="52" rx="10" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.5"/><text x="330.0" y="679.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">softmax</text><text x="330.0" y="699.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">probabilities</text><path d="M 125 132 C 30 132, 30 608, 226 608" fill="none" stroke="#6250d6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow6250d6)"/><text x="76" y="366" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="600" fill="#6250d6" text-anchor="start" dominant-baseline="middle">weight tying:</text><text x="76" y="383" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="600" fill="#6250d6" text-anchor="start" dominant-baseline="middle">the same</text><text x="76" y="400" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="600" fill="#6250d6" text-anchor="start" dominant-baseline="middle">matrix</text><text x="640" y="22" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" dominant-baseline="middle">tensor shape</text><line x1="560" y1="46" x2="630" y2="46" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="3 3"/><text x="640" y="46" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">(B, T)</text><line x1="560" y1="200" x2="630" y2="200" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="3 3"/><text x="640" y="200" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">(B, T, C)</text><line x1="560" y1="392" x2="630" y2="392" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="3 3"/><text x="640" y="392" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">(B, T, C)</text><line x1="560" y1="534" x2="630" y2="534" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="3 3"/><text x="640" y="534" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">(B, T, C)</text><line x1="560" y1="608" x2="630" y2="608" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="3 3"/><text x="640" y="608" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">(B, T, V)  logits</text><line x1="560" y1="688" x2="630" y2="688" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="3 3"/><text x="640" y="688" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">(B, T, V)</text><text x="640" y="742" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">B = batch, T = tokens,</text><text x="640" y="759" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">C = width, V = vocab size</text><text x="330" y="760" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">every position predicts the token that comes after it</text></svg>