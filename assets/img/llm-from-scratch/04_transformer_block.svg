<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 690" width="820" height="690" role="img" aria-label="A pre-norm transformer block: two sub-layers, each wrapped in a residual connection"><title>A pre-norm transformer block: two sub-layers, each wrapped in a residual connection</title><defs><marker id="arrow52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="150" y="28" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">input x   (B, T, C)</text><line x1="150" y1="44" x2="150" y2="640" stroke="#2a78d6" stroke-width="4"/><path d="M 141 636 L 159 636 L 150 652 Z" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="134" y="380" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="600" fill="#2a78d6" text-anchor="end" dominant-baseline="middle">residual stream</text><path d="M 150 90 L 430 90 L 430 106" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow52514e)"/><rect x="300" y="108" width="260" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/><text x="430.0" y="130.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">LayerNorm</text><line x1="430" y1="152" x2="430" y2="176" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="300" y="178" width="260" height="64" rx="10" fill="#fdebe3" stroke="#eb6834" stroke-width="1.5"/><text x="430.0" y="201.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Masked multi-head</text><text x="430.0" y="221.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">self-attention</text><path d="M 430 242 L 430 272 L 166 272" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow52514e)"/><circle cx="150" cy="272" r="13" fill="#fff" stroke="#52514e" stroke-width="1.8"/><line x1="142.85" y1="272" x2="157.15" y2="272" stroke="#52514e" stroke-width="2"/><line x1="150" y1="264.85" x2="150" y2="279.15" stroke="#52514e" stroke-width="2"/><text x="232" y="258" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">x + attn(ln1(x))</text><text x="585" y="196" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">communicate: every token</text><text x="585" y="214" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">gathers information from</text><text x="585" y="232" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">the tokens before it</text><path d="M 150 330 L 430 330 L 430 346" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow52514e)"/><rect x="300" y="348" width="260" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/><text x="430.0" y="370.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">LayerNorm</text><line x1="430" y1="392" x2="430" y2="414" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="300" y="416" width="260" height="150" rx="10" fill="#e0f5ed" stroke="#1baf7a" stroke-width="1.5"/><text x="430" y="434" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">MLP (feed-forward)</text><rect x="330" y="450" width="200" height="30" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/><text x="400" y="465" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Linear</text><text x="480" y="465" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">C → 4C</text><rect x="330" y="488" width="200" height="30" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/><text x="430" y="503" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">GELU</text><rect x="330" y="526" width="200" height="30" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/><text x="400" y="541" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">Linear</text><text x="480" y="541" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">4C → C</text><path d="M 430 566 L 430 596 L 166 596" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow52514e)"/><circle cx="150" cy="596" r="13" fill="#fff" stroke="#52514e" stroke-width="1.8"/><line x1="142.85" y1="596" x2="157.15" y2="596" stroke="#52514e" stroke-width="2"/><line x1="150" y1="588.85" x2="150" y2="603.15" stroke="#52514e" stroke-width="2"/><text x="232" y="582" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">x + mlp(ln2(x))</text><text x="585" y="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">compute: every token is</text><text x="585" y="488" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">processed on its own,</text><text x="585" y="506" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">with the same weights</text><text x="150" y="672" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">output   (B, T, C), same shape: blocks stack</text></svg>