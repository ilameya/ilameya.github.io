<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="One training step, repeated thousands of times"><title>One training step, repeated thousands of times</title><defs><marker id="arrow52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arrow8a8984" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="50" width="160" height="70" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="100.0" y="76.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">1. sample a batch</text><text x="100.0" y="96.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">x, y = get_batch()</text><line x1="180" y1="85" x2="208" y2="85" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="210" y="50" width="160" height="70" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/><text x="290.0" y="76.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">2. forward pass</text><text x="290.0" y="96.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">logits = model(x)</text><line x1="370" y1="85" x2="398" y2="85" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="400" y="50" width="160" height="70" rx="10" fill="#ecebfb" stroke="#6250d6" stroke-width="1.5"/><text x="480.0" y="76.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">3. loss</text><text x="480.0" y="96.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">cross_entropy(logits, y)</text><line x1="560" y1="85" x2="588" y2="85" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="590" y="50" width="160" height="70" rx="10" fill="#ecebfb" stroke="#6250d6" stroke-width="1.5"/><text x="670.0" y="76.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">4. backward pass</text><text x="670.0" y="96.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">loss.backward()</text><line x1="750" y1="85" x2="778" y2="85" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow52514e)"/><rect x="780" y="50" width="160" height="70" rx="10" fill="#ecebfb" stroke="#6250d6" stroke-width="1.5"/><text x="860.0" y="76.0" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">5. update weights</text><text x="860.0" y="96.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">opt.step()</text><text x="100.0" y="140" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">random windows of text</text><text x="290.0" y="140" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">predict every next token</text><text x="480.0" y="140" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">how surprised were we?</text><text x="670.0" y="140" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">gradient for every weight</text><text x="860.0" y="140" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">AdamW + LR schedule</text><path d="M 860.0 158 L 860.0 205 L 8 205 L 8 85 L 18 85" fill="none" stroke="#8a8984" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow8a8984)"/><text x="480" y="230" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="middle">repeat (3,000 steps for our model): the loss goes down, the samples get better</text></svg>